# ==================== 基本网站设置 ====================
locale                   : "zh-CN"
site_theme               : "mint"        # 可选: default, air, sunrise, mint, dirt, contrast
title                    : "管胤祺 · 世源学与动态认知学"
name                     : "管胤祺"
description              : "世源学创立者。动态认知学与态演算。独立研究者。"
url                      : https://guanyinqi.github.io
repository               : "guanyinqi/guanyinqi.github.io"

# ==================== 作者信息（侧边栏） ====================
author:
  name                : "管胤祺"
  avatar              : "profile.png"
  bio                 : "世源学创立者。动态认知学与态演算。从三条公设出发，构建了一套完整的过程本体论公理体系。"
  location            : "北京"
  email               : "xingyuguanyinqi@qq.com"
  github              : "guanyinqi"
  googlescholar       : "https://scholar.google.com/citations?user=PS_CX0AAAAAJ"
  # 以下全部清空（不需要的社交链接）
  orcid               : ""
  arxiv               : ""
  researchgate        : ""
  scopus              : ""
  pubmed              : ""
  zotero              : ""
  bitbucket           : ""
  codepen             : ""
  dribbble            : ""
  kaggle              : ""
  stackoverflow       : ""
  bluesky             : ""
  facebook            : ""
  flickr              : ""
  foursquare          : ""
  goodreads           : ""
  google_plus         : ""
  keybase             : ""
  instagram           : ""
  lastfm              : ""
  linkedin            : ""
  mastodon            : ""
  medium              : ""
  pinterest           : ""
  soundcloud          : ""
  steam               : ""
  telegram            : ""
  tumblr              : ""
  twitter             : ""
  vine                : ""
  weibo               : ""
  wikipedia           : ""
  xing                : ""
  youtube             : ""
  zhihu               : ""

# ==================== 网站功能设置 ====================
teaser                   :  # filename of teaser fallback teaser image placed in /images/
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
atom_feed:
  hide                   : true

# ==================== 评论区（giscus）设置 ====================
comments:
  provider               : "custom"

# ==================== SEO 与社交分享 ====================
google_site_verification :
bing_site_verification   :
og_image                 :  # 默认社交媒体预览图
og_description           :  # 默认社交媒体预览描述

# ==================== 分析（不需要就关掉） ====================
analytics:
  provider               : "false"

# ==================== 文件包含与排除 ====================
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# ==================== Markdown 转换设置 ====================
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# ==================== Collections 集合 ====================
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# ==================== 默认页面设置 ====================
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# ==================== Sass/CSS 设置 ====================
sass:
  sass_dir: _sass
  style: compressed

# ==================== 输出设置 ====================
permalink: /:categories/:title/
timezone: Asia/Shanghai

# ==================== 插件 ====================
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# ==================== 归档 ====================
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# ==================== HTML 压缩 ====================
compress_html:
  clippings: all
  ignore:
    envs: development
